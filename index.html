<!DOCTYPE html>
<html lang="th">
<head>
<!-- build: 20260905-0627 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08743F">
<meta name="application-name" content="LP Scan Form">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="msapplication-TileColor" content="#08743F">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app-icon-32-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180-v2.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>LP Scan Form — ADJ / RTC</title>
<style>
:root{
  --bg:#F3FAFC; --soft:#EDF8FA; --card:#FFFFFF; --input:#F7FAFC;
  --navy:#14283A; --sec:#6F8492; --muted:#91A1AC;
  --blue:#22A9E6; --blueStrong:#138FD2; --blueSoft:#E4F5FD;
  --teal:#20C5BE; --tealStrong:#119E9A; --tealSoft:#E2F8F6;
  --border:#D7E7EC; --divider:#E8F0F3;
  --success:#169B75; --warn:#D89A2B; --danger:#D84A43;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--navy);
  font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,Arial,sans-serif;
  font-size:16px; line-height:1.5; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
.wrap{padding:0 20px; max-width:520px; margin:0 auto}
header.app{padding:calc(16px + env(safe-area-inset-top)) 20px 14px; display:flex;
  align-items:center; gap:12px; position:sticky; top:0; background:rgba(243,250,252,.9);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:20}
header.app h1{font-size:21px; font-weight:800; letter-spacing:-.02em; margin:0}
.lp-head-copy{min-width:0; flex:1; display:flex; flex-direction:column; justify-content:center}
.lp-head-sub{margin-top:2px; font-size:12.5px; font-weight:600; color:var(--sec)}
.app-mark{width:60px;height:60px;border-radius:18px;display:block;flex:0 0 auto;box-shadow:0 8px 20px rgba(8,116,63,.18)}
.badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:6px 13px; border-radius:999px; background:var(--blueSoft); color:var(--blueStrong)}
.badge.rtc{background:var(--tealSoft); color:var(--tealStrong)}
#syncBadge::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto}
.card{background:var(--card); border:1px solid var(--border); border-radius:22px;
  box-shadow:0 8px 24px rgba(20,40,58,.05); padding:20px; margin-bottom:16px}
.card h2{font-size:17px; margin:0 0 6px; font-weight:700}
.card p.help{margin:0; color:var(--sec); font-size:14px}
.mode-card{display:flex; align-items:center; gap:16px; cursor:pointer; transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.mode-card:active{transform:scale(.97); transition:transform 0s}
.icon{width:56px; height:56px; border-radius:18px; display:flex; align-items:center;
  justify-content:center; font-size:20px; font-weight:800; flex:0 0 auto}
.icon.blue{background:var(--blueSoft); color:var(--blueStrong)}
.icon.teal{background:var(--tealSoft); color:var(--tealStrong)}
.status{font-size:13px; margin-top:6px; font-weight:600}
.status.ok{color:var(--success)} .status.no{color:var(--warn)}
label.fld{display:block; font-size:13px; font-weight:600; color:var(--sec); margin:0 0 6px}
input,select{width:100%; height:52px; background:var(--input); border:1px solid var(--border);
  border-radius:13px; padding:0 14px; font-size:16px; color:var(--navy); font-family:inherit; outline:none}
input:focus,select:focus{border-color:var(--blue)}
.row2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.field{margin-bottom:16px}
.btn{display:block; width:100%; height:52px; border:none; border-radius:15px; background:var(--blue);
  color:#fff; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s}
.btn:active{transform:scale(.96); transition:transform 0s}
.btn.teal{background:var(--teal)}
.btn.sec{background:var(--blueSoft); color:var(--blueStrong)}
.btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--border)}
.btn.danger{background:#fff; color:var(--danger); border:1px solid #F0CFCD}
.btnrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{padding:9px 14px; border-radius:12px; background:var(--input); border:1px solid var(--border);
  font-size:14px; font-weight:600; color:var(--navy); cursor:pointer; min-height:44px; display:flex; align-items:center;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .15s, border-color .15s, color .15s}
.chip:active{transform:scale(.94); transition:transform 0s}
.chip.on{background:var(--blue); border-color:var(--blue); color:#fff}
.chip.on.teal{background:var(--teal); border-color:var(--teal)}
.filebtn{position:relative; overflow:hidden; display:block}
.filebtn input[type=file]{position:absolute; inset:0; opacity:0; width:100%; height:100%}
#reader{width:100%; border-radius:20px; overflow:hidden; background:#0b1a26; min-height:250px}
#reader video{width:100%!important; display:block}
.scanhint{text-align:center; color:var(--sec); font-size:14px; margin:12px 0}
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border);
  display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); z-index:30}
nav.tabs button{flex:1; background:none; border:none; font-family:inherit; font-size:12px;
  font-weight:600; color:var(--muted); padding:8px 4px; border-radius:14px; cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .15s, color .15s}
nav.tabs button:active{transform:scale(.93); transition:transform 0s}
nav.tabs button.on{background:var(--blueSoft); color:var(--blueStrong)}
nav.tabs .tl{display:block; font-size:18px; margin-bottom:2px}
.item{background:#fff; border:1px solid var(--border); border-radius:18px; padding:14px 16px; margin-bottom:10px}
.item .top{display:flex; gap:10px; align-items:flex-start}
.item .no{font-size:13px; font-weight:700; color:var(--muted); min-width:22px}
.item .nm{flex:1; font-weight:600; font-size:15px; line-height:1.35}
.item .bc{font-size:12.5px; color:var(--sec); margin-top:2px; font-variant-numeric:tabular-nums}
.item .meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:12px; font-weight:600; padding:4px 10px; border-radius:9px; background:var(--soft); color:var(--sec)}
.tag.k{background:var(--blueSoft); color:var(--blueStrong)}
.tag.t{background:var(--tealSoft); color:var(--tealStrong)}
.item .acts{display:flex; gap:8px; margin-top:12px}
.item .acts button{flex:1; height:40px; border-radius:11px; border:1px solid var(--border);
  background:#fff; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--navy);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.item .acts button:active{transform:scale(.94); transition:transform 0s}
.item .acts button.del{color:var(--danger); border-color:#F0CFCD}
.empty{text-align:center; padding:44px 20px; color:var(--muted)}
.empty .e{font-size:38px; opacity:.35}
.empty h3{font-size:16px; margin:12px 0 4px; color:var(--sec)}
.sheet{position:fixed; inset:0; background:rgba(20,40,58,.4); z-index:50; display:none; align-items:flex-end; justify-content:center}
.sheet.show{display:flex}
.sheet .inner{background:var(--bg); width:100%; max-width:520px; border-radius:26px 26px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto}
.sheet h2{margin:0 0 4px; font-size:18px}
.prodbox{background:var(--blueSoft); border-radius:16px; padding:14px; margin-bottom:16px}
.prodbox .nm{font-weight:700; font-size:15px}
.prodbox .bc{font-size:13px; color:var(--blueStrong); margin-top:3px; font-variant-numeric:tabular-nums}
.prodbox.warn{background:#FDF4E5}
.calc{background:var(--tealSoft); border-radius:14px; padding:12px 14px; margin-bottom:16px;
  display:flex; justify-content:space-between; align-items:center}
.calc b{font-size:20px; color:var(--tealStrong)}
.note{font-size:13px; color:var(--sec); background:var(--soft); border-radius:14px; padding:12px 14px; margin-bottom:16px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:100px; z-index:80; background:var(--navy);
  color:#fff; padding:12px 20px; border-radius:14px; font-size:14px; font-weight:600;
  opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%}
.toast.show{opacity:.95}
hr.d{border:none; border-top:1px solid var(--divider); margin:18px 0}

/* ---------- compact two-card home ---------- */
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
#vHome{position:relative;isolation:isolate;overflow:hidden;padding-top:2px;padding-bottom:8px}
#vHome::before,#vHome::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
#vHome::before{width:340px;height:340px;right:-215px;top:30px;background:rgba(170,238,220,.17)}
#vHome::after{width:250px;height:250px;left:-165px;top:320px;background:rgba(120,232,196,.12)}
.home-welcome{margin:18px 0 20px}
.home-welcome-title{margin:0;font-size:32px;line-height:1.15;font-weight:850;letter-spacing:-.03em;color:#073B2D}
.home-welcome-name{margin:7px 0 0;font-size:22px;line-height:1.25;font-weight:750;color:#667B8A;overflow-wrap:break-word;word-break:break-word}
.home-heading{font-size:15px;line-height:1.5;margin:10px 0 18px;font-weight:600;color:var(--sec);letter-spacing:0}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
button.mode-tile{appearance:none;-webkit-appearance:none;width:100%;min-width:0;padding:0 0 18px;background:#fff;border:1px solid rgba(194,220,226,.9);border-radius:26px;overflow:hidden;color:var(--navy);font:inherit;text-align:center;cursor:pointer;box-shadow:0 12px 26px rgba(20,40,58,.07);transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .15s,box-shadow .15s}
button.mode-tile:active{transform:scale(.96);transition:transform 0s}
button.mode-tile:focus-visible{outline:3px solid rgba(22,155,117,.24);outline-offset:3px}
.mode-art{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--soft)}
.mode-art img{display:block;width:100%;height:100%;object-fit:cover}
.mode-copy{padding:16px 9px 0;display:flex;min-height:200px;flex-direction:column;align-items:center}
.mode-code{font-size:34px;line-height:1;font-weight:900;letter-spacing:.01em;margin:0 0 12px;color:#082F27}
.mode-title{font-size:15px;line-height:1.35;font-weight:750;margin:0 0 4px}
.mode-sub{font-size:12.5px;line-height:1.35;color:var(--sec);margin:0}
.mode-open{display:inline-flex;align-items:center;justify-content:center;min-width:0;width:88%;height:44px;margin-top:auto;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#12B77E,#079763);color:#fff;font-size:14px;font-weight:750;box-shadow:0 8px 18px rgba(7,151,99,.2)}
.mode-open::after{content:"›";font-size:22px;line-height:1;margin-left:8px;margin-top:-2px}
.mode-cap,.home-meta{display:none!important}
@media(max-width:390px){
  .wrap{padding-left:16px;padding-right:16px}
  .app-mark{width:52px;height:52px}
  header.app h1{font-size:19px}
  .lp-head-sub{font-size:12px}
  .home-welcome-title{font-size:29px}
  .home-welcome-name{font-size:20px}
  .mode-grid{gap:10px}
  .mode-copy{padding-left:7px;padding-right:7px;min-height:188px}
  .mode-code{font-size:30px}
  .mode-title{font-size:14px}
  .mode-sub{font-size:11.5px}
  .mode-open{width:92%;height:42px;font-size:13.5px}
}

/* ---------- login screen refresh ---------- */
#vLogin{position:relative;isolation:isolate;overflow:hidden;padding-top:26px;padding-bottom:8px}
#vLogin::before,#vLogin::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
#vLogin::before{width:300px;height:300px;right:-190px;top:-50px;background:rgba(170,238,220,.18)}
#vLogin::after{width:230px;height:230px;left:-150px;top:250px;background:rgba(120,232,196,.13)}
.login-card{border-radius:30px;border-color:rgba(151,214,196,.55);box-shadow:0 16px 34px rgba(20,40,58,.08);padding:28px 24px}
.login-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.login-head .icon{width:48px;height:48px;border-radius:15px;flex:0 0 auto}
.login-card h2{font-size:22px;font-weight:850;letter-spacing:-.01em;margin:0}
.login-card .help{color:#7C93A2;font-size:14px;line-height:1.55;margin:0 0 22px}
.login-input-wrap{position:relative}
.login-input-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--success);pointer-events:none}
.login-input-wrap input{height:58px;border-radius:17px;padding-left:48px;border-color:rgba(151,214,196,.75);font-size:16px}
.login-input-wrap input:focus{border-color:var(--success);box-shadow:0 0 0 3px rgba(22,155,117,.14)}
.login-btn{height:58px;border-radius:20px;background:linear-gradient(180deg,#12B77E,#079763);
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 10px 22px rgba(7,151,99,.24);margin-top:22px}
.login-btn::after{content:"›";font-size:22px;line-height:1;margin-top:-2px}
.login-card .help#loginMsg:not(:empty){margin-top:14px;padding:10px 13px;background:#FCEEED;border-radius:12px;font-size:13.5px;line-height:1.5}
@media(max-width:390px){
  .login-card{padding:24px 20px}
  .login-card h2{font-size:20px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="app">
  <img class="app-mark" src="assets/app-mark.webp" alt="" width="96" height="96">
  <div class="lp-head-copy">
    <h1 id="appTitle">LP Scan Form</h1>
    <div class="lp-head-sub" id="headSub">สแกนง่าย จัดการได้ไว</div>
  </div>
  <span class="badge" id="syncBadge" style="display:none"></span>
  <span class="badge" id="modeBadge" style="display:none"></span>
</header>

<section id="vLogin" class="wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="icon teal" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      </span>
      <h2>เข้าสู่ระบบ</h2>
    </div>
    <p class="help">กรอกรหัสพนักงานเพื่อเริ่มงาน — ระบบจะตรวจกับรายชื่อพนักงานก่อนเสมอ</p>
    <div class="field" style="margin-top:0">
      <label class="fld" for="fEmpCode">รหัสพนักงาน</label>
      <div class="login-input-wrap">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M15 10h4M15 14h4M6 16h6"/></svg>
        <input id="fEmpCode" placeholder="เช่น E1023" autocapitalize="characters">
      </div>
    </div>
    <button class="btn login-btn" onclick="checkEmployee()">เริ่มงาน</button>
    <p class="help" id="loginMsg" style="margin-top:12px;color:var(--danger)"></p>
  </div>
</section>

<section id="vHome" class="wrap" style="display:none" aria-labelledby="homeHeading">
  <div class="home-welcome">
    <h2 class="home-welcome-title">สวัสดีครับ</h2>
    <p class="home-welcome-name" id="homeEmployeeName">พนักงาน</p>
  </div>
  <p class="home-heading" id="homeHeading">เลือกแบบฟอร์ม เพื่อเริ่มใช้งาน</p>

  <div class="mode-grid">
    <button class="mode-tile" type="button" onclick="pickMode('ADJ')" aria-label="เปิดใบแก้ไขรายการ Adjust code">
      <div class="mode-art">
        <img src="assets/adj-card.webp" alt="" width="480" height="480">
      </div>
      <div class="mode-copy">
        <div class="mode-code">ADJ</div>
        <div class="mode-title">ใบแก้ไขรายการ</div>
        <p class="mode-sub">Adjust code</p>
        <span class="mode-open">เปิดฟอร์ม</span>
      </div>
    </button>

    <button class="mode-tile" type="button" onclick="pickMode('RTC')" aria-label="เปิดฟอร์มลดราคา Markdown Price">
      <div class="mode-art">
        <img src="assets/rtc-card.webp" alt="" width="480" height="480">
      </div>
      <div class="mode-copy">
        <div class="mode-code">RTC</div>
        <div class="mode-title">ฟอร์มลดราคา</div>
        <p class="mode-sub">Markdown Price</p>
        <span class="mode-open">เปิดฟอร์ม</span>
      </div>
    </button>
  </div>

  <!-- แถวนี้ซ่อนจาก UI ตามดีไซน์ใหม่ (ข้อมูลพนักงาน/เปลี่ยนพนักงาน) แต่คง element ไว้เพราะ
       afterLogin()/logoutEmployee() ใน logic เดิมยังอ้างอิง #empInfo อยู่ — ซ่อนด้วย CSS (.home-meta) ไม่ลบ DOM -->
  <div class="home-meta" aria-live="polite">
    <span id="empInfo">—</span>
    <span aria-hidden="true">·</span>
    <button type="button" onclick="logoutEmployee()">เปลี่ยนพนักงาน</button>
  </div>
  <div class="sr-only" aria-live="polite">
    <span id="masterInfo">กำลังเตรียมข้อมูล…</span>
  </div>
</section>

<section id="vScan" class="wrap" style="display:none">
  <div class="card" style="padding:14px">
    <div id="reader"></div>
    <div class="scanhint" id="scanHint">กำลังเปิดกล้อง…</div>
    <div class="btnrow">
      <button class="btn sec" onclick="manualEntry()">พิมพ์บาร์โค้ดเอง</button>
      <button class="btn ghost" onclick="toggleCam()" id="camBtn">ปิดกล้อง</button>
    </div>
  </div>
  <div class="note" id="scanCount">ยังไม่มีรายการ</div>
</section>

<section id="vList" class="wrap" style="display:none">
  <div class="card">
    <h2>ข้อมูลหัวฟอร์ม</h2>
    <div class="field"><label class="fld">สาขา</label><input id="fBranch" placeholder="ไทรน้อย 11252"></div>
    <div class="row2">
      <div class="field"><label class="fld">แผนก</label>
        <select id="fDept">
          <option value="">เลือกแผนก</option>
          <option value="0510 BUTCHERY">0510 BUTCHERY</option>
          <option value="0520 SEAFOOD">0520 SEAFOOD</option>
          <option value="0530 PRODUCE">0530 PRODUCE</option>
          <option value="0540 DELICATESSEN">0540 DELICATESSEN</option>
          <option value="0550 BAKERY">0550 BAKERY</option>
          <option value="0560 PERISHABLE">0560 PERISHABLE</option>
          <option value="0562 PERISHABLE_SME">0562 PERISHABLE_SME</option>
          <option value="0570 FROZEN">0570 FROZEN</option>
        </select>
      </div>
      <div class="field"><label class="fld">วันที่</label><input id="fDate" type="date"></div>
    </div>
  </div>
  <div id="listBox"></div>
  <div class="card" id="expBox">
    <h2 id="finishTitle">จบเอกสาร</h2>
    <p class="help" id="expInfo" style="margin-bottom:14px"></p>
    <button class="btn" id="finishBtn" style="margin-bottom:10px" onclick="finishDocument()">บันทึกและจบเอกสาร</button>
    <button class="btn danger" onclick="clearAll()">ล้างรายการทั้งหมด</button>
  </div>
</section>

<div class="sheet" id="sheet">
  <div class="inner">
    <h2 id="shTitle">เพิ่มรายการ</h2>
    <div class="prodbox" id="shProd">
      <div class="nm" id="shName">—</div>
      <div class="bc" id="shBc"></div>
      <div class="bc" id="shWeight" style="display:none"></div>
    </div>
    <div class="field" id="wrapManualName" style="display:none">
      <label class="fld">ชื่อสินค้า (ไม่พบในรายการ — พิมพ์เอง)</label>
      <input id="fName" placeholder="ชื่อสินค้า">
    </div>

    <div id="adjFields">
      <div class="field">

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');

// ห้ามตัดเลข 0 นำหน้าออก — บาร์โค้ดจริง (เช่น EAN-13) มีความหมายทุกหลักรวมถึง 0 นำหน้า
function normBc(v){ return String(v==null?'':v).replace(/\D/g,''); }
// บาร์โค้ดสินค้าชั่งน้ำหนัก/นับชิ้น (Fresh Food, Bakery, Deli) ฝังน้ำหนัก/ราคาไว้ในตัวเลขเอง — คนละแพ็ค

// (หลักที่ 2-6) มาใช้แทนทั้งตอนสแกนและตอนอัปโหลดฐานข้อมูล CSV — โครงสร้างคือ "2"+PLU 5 หลัก+"0"+
// ส่วนที่เหลือ (ราคา/น้ำหนัก+check digit) ยืนยันจากของจริง 2 แบบ:
//   สแกนจากป้ายจริง (18 หลัก, มีราคา/น้ำหนักจริงฝังอยู่): 211278008900001447, 211278010275001663
//   ในไฟล์ฐานข้อมูลกลางที่ HO ให้มา (12 หลัก, ส่วนท้ายเป็น placeholder): 211918000000, 212013000001
// ทั้งสองแบบ 7 หลักแรกคงที่ตามสินค้าเป๊ะ ("2"+PLU+"0") ต่างกันแค่ความยาวส่วนท้าย
function scaleKey(bc){
  return (bc.length>=11 && bc.length<=18 && bc[0]==='2' && bc[6]==='0') ? bc.slice(1,6) : bc;
}
// สินค้าชั่งน้ำหนักฝังน้ำหนักจริงไว้ใน 4 หลักก่อน check digit ตัวสุดท้าย เป็นกรัม (นัย 3 ตำแหน่งทศนิยม)
// เช่นป้าย 0.654 กก. x 75.01 บาท/กก. = 49.0 บาท จะเจอ "...0654X" ในบาร์โค้ด (X = check digit)
// ต้องเอาน้ำหนักนี้คูณราคาต่อหน่วยใน master ถึงจะได้ราคาจริงของชิ้นที่ชั่งมา ไม่ใช่ราคาต่อกก.เฉยๆ
function scaleWeightKg(bc){
  if(!(bc.length>=11 && bc.length<=18 && bc[0]==='2' && bc[6]==='0')) return null;
  const g = Number(bc.slice(-5,-1));
  return (Number.isFinite(g) && g>0) ? g/1000 : null;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadScript(urls){
  return new Promise((res,rej)=>{ let i=0;
    const nx=()=>{ if(i>=urls.length) return rej(new Error('load fail'));
      const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>res(); s.onerror=nx;
      document.head.appendChild(s); };
    nx(); });
}

function docSnapshot(status){

function loadFinishedQueue(){
  try{ const q=JSON.parse(localStorage.getItem('lpsf_finished_queue')||'[]'); return Array.isArray(q)?q:[]; }
  catch(e){ return []; }
}
function saveFinishedQueue(q){
  try{ localStorage.setItem('lpsf_finished_queue',JSON.stringify(q)); }catch(e){}
}
function enqueueFinished(entry){
  const q=loadFinishedQueue(), i=q.findIndex(x=>x.id===entry.id);
  if(i>=0) q[i]=entry; else q.push(entry);
  saveFinishedQueue(q);
}
function migrateLegacyPending(){
  let old; try{ old=JSON.parse(localStorage.getItem('lpsf_pending_doc')||'null'); }catch(e){ old=null; }
  if(!old||!old.id||!old.doc) return;
  try{
    if(old.doc.status==='ready') enqueueFinished(old);
    else if(old.doc.employeeCode && !loadDraft(old.doc.employeeCode))
      localStorage.setItem(draftKey(old.doc.employeeCode),JSON.stringify(old));
    localStorage.removeItem('lpsf_pending_doc');
  }catch(e){}
}
let finishedSyncing=false;
async function trySyncFinishedDocs(){
  if(finishedSyncing) return false;
  finishedSyncing=true;
  let allSynced=true;
  try{
    while(true){
      const q=loadFinishedQueue();
      if(!q.length) break;
      const current=q[0];
      setSyncBadge('syncing');
      try{
        try{
          await window.fsCreate('documents',current.id,current.doc);
        }catch(e){
          // เอกสารนี้ถูกสร้างไปแล้วจากรอบ sync ก่อนหน้า (แค่ retry ซ้ำ ไม่ใช่ error จริง) — ถือว่าสำเร็จ
          // ห้ามใช้ fsUpdate เขียนทับซ้ำ เพราะจะไปทับสถานะ/downloadCount ที่เดสก์ท็อปอาจแก้ไปแล้ว
          if(!e.alreadyExists) throw e;
        }
        saveFinishedQueue(loadFinishedQueue().filter(x=>x.id!==current.id));
        S.online=true; setSyncBadge('online');
      }catch(e){
        allSynced=false; S.online=false; setSyncBadge('offline'); break;
      }
    }
  }finally{ finishedSyncing=false; }
  return allSynced && loadFinishedQueue().length===0;
}
function queueProduct(bc,name,price,unit){
  let q; try{ q=JSON.parse(localStorage.getItem('lpsf_pending_products')||'[]'); }catch(e){ q=[]; }
  const entry={bc,name};
  if(price) entry.price=price;
  if(unit) entry.unit=unit;
  q.push(entry); try{ localStorage.setItem('lpsf_pending_products', JSON.stringify(q)); }catch(e){}
  tryFlushProducts();
}
async function tryFlushProducts(){
  let q; try{ q=JSON.parse(localStorage.getItem('lpsf_pending_products')||'[]'); }catch(e){ q=[]; }
  if(!q.length) return;
  const rest=[];
  for(const p of q){
    const data={name:p.name, updatedAt:new Date()};
    if(p.price) data.price=p.price;
    if(p.unit) data.unit=p.unit;
    try{ await window.fsUpsert('products',p.bc,data); }
    catch(e){ rest.push(p); }
  }
  try{ localStorage.setItem('lpsf_pending_products', JSON.stringify(rest)); }catch(e){}
}
window.addEventListener('online', ()=>{ trySyncFinishedDocs(); tryFlushProducts(); });

function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/,'');
  const sep = (txt.split('\n')[0].split('\t').length > txt.split('\n')[0].split(',').length) ? '\t' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
async function loadMaster(inp){
  const f=inp.files[0]; if(!f) return;
  toast('กำลังอ่านไฟล์…');
  try{
    const rows=parseCSV(await f.text());
    const h=(rows[0]||[]).map(x=>String(x||'').trim().toUpperCase());
    // หาคอลัมน์ทีละ "ลำดับความเฉพาะเจาะจง" (tier) ก่อน — คำทั่วไปอย่าง NAME/ชื่อ อาจชนกับคอลัมน์อื่น
    // ที่ไม่ใช่ชื่อสินค้า (เช่นไฟล์จากระบบ POS ที่มี DIVISION_NAME, DEPT_GROUP_NAME ปนกับ ART_SV_NAME)
    // จึงต้องลองคำเฉพาะเจาะจงกว่าก่อน ค่อย fallback ไปคำทั่วไปถ้าไม่เจอ
    const find=tiers=>{
      for(const ks of tiers){ const idx=h.findIndex(x=>ks.some(k=>x.indexOf(k)>=0)); if(idx>=0) return idx; }
      return -1;
    };
    const iB=find([['BARCODE','บาร์โค้ด']]),
          iN=find([['ART_SV_NAME','ITEM_NAME','PRODUCT_NAME'],['ชื่อ','DESC','NAME']]),
          iP=find([['PRICE','ราคา']]), iU=find([['UNIT','หน่วย','UOM']]);
    if(iB<0){ toast('ไม่พบคอลัมน์ BARCODE'); return; }
    const ov={}; let n=0;
    for(let i=1;i<rows.length;i++){
      const bc=scaleKey(normBc(rows[i][iB])); if(!bc) continue;
      const o=S.master[bc]||(S.master[bc]={});
      if(iN>=0&&rows[i][iN]) o.name=String(rows[i][iN]).trim();
      if(iP>=0&&rows[i][iP]) o.price=Number(String(rows[i][iP]).replace(/[^\d.-]/g,''));
      if(iU>=0&&rows[i][iU]) o.unit=String(rows[i][iU]).trim();
      ov[bc]=o; n++;
    }
    try{ localStorage.setItem('lpsf_products_cache', JSON.stringify(S.master)); }catch(e){}
    $('masterInfo').textContent = Object.keys(S.master).length.toLocaleString()+
      ' รายการ (อัปเดต '+n.toLocaleString()+(iP>=0?' · มีราคา':'')+')';
    toast('อัปเดตรายการสินค้าในเครื่องแล้ว กำลังซิงก์ขึ้นฐานข้อมูลกลาง…');
    let ok=0;
    for(const bc in ov){
      try{ await window.fsUpsert('products', bc, Object.assign({updatedAt:new Date()}, ov[bc])); ok++; }
      catch(e){ /* เครือข่ายมีปัญหา — เหลือใน localStorage แล้ว ผู้ใช้อัปโหลดซ้ำได้ภายหลัง */ }
    }
    toast(ok===n ? 'ซิงก์ขึ้นฐานข้อมูลกลางครบ '+ok+' รายการ' : 'ซิงก์ได้ '+ok+'/'+n+' รายการ (ที่เหลือ ลองอัปโหลดใหม่เมื่อเน็ตพร้อม)');
  }catch(e){ console.error(e); toast('อ่านไฟล์ไม่สำเร็จ'); }
}

/* ---------- navigation ---------- */
function applyModeUI(m){
  S.mode=m;
  if(S.docId&&!S.locked) setSyncBadge('draft');
  $('modeBadge').style.display='inline-block';
  $('modeBadge').textContent=m;
  $('modeBadge').className='badge'+(m==='RTC'?' rtc':'');
  $('appTitle').textContent = m==='ADJ' ? 'ใบแก้ไขรายการ Adjust' : 'Markdown Price Form';
  $('saveBtn').className='btn'+(m==='RTC'?' teal':'');
  $('tabs').style.display='flex';
  $('scanCount').textContent = S.items[m].length ? ('บันทึกแล้ว '+S.items[m].length+' รายการ') : 'ยังไม่มีรายการ';

  go('scan');

// หน่วงก่อนสลับหน้าจอเล็กน้อย (ตัวเลขจับเวลาเท่านั้น ไม่เปลี่ยนลำดับ/ผลลัพธ์ของ logic) —
// เดิมกดการ์ด ADJ/RTC แล้วสลับจากหน้า Home ไปหน้าสแกนทันทีในจังหวะเดียวกับที่นิ้วปล่อยจากปุ่ม
// เบราว์เซอร์เลยไม่มีเวลาวาดเฟรม animation กดปุ่ม (:active) ให้เห็นก่อนหน้าจอจะเปลี่ยนไปแล้ว
var MODE_TILE_TAP_DELAY=130;
function pickMode(m){
  if(!S.employee){ toast('กรุณาเข้าสู่ระบบก่อน'); return; }
  if(S.docId&&S.mode){
    if(m!==S.mode){
      if(S.items[S.mode].length===0){
        // เอกสารเดิมยังไม่มีรายการเลย — ไม่มีอะไรจะเสีย ยกเลิกอัตโนมัติแล้วเปิดโหมดใหม่แทนที่จะดักผู้ใช้ไว้
        S.docId=null; S.locked=false;
      }else{
        toast('มีเอกสาร '+S.mode+' ค้างอยู่ — กรุณาบันทึกและจบเอกสารก่อน');
        setTimeout(()=>applyModeUI(S.mode), MODE_TILE_TAP_DELAY);
        return;
      }
    }else{
      setTimeout(()=>applyModeUI(S.mode), MODE_TILE_TAP_DELAY);
      return;
    }
  }
  S.docId=m+'-'+S.employee.code+'-'+docTimeStamp()+'-'+Math.random().toString(36).slice(2,5);
  S.items[m]=[]; S.locked=false;
  setTimeout(()=>{
    applyModeUI(m);
    saveDraft();
    toast('สร้างเอกสารใหม่: '+S.docId);
  }, MODE_TILE_TAP_DELAY);
}
function go(v){
  S.view=v;
  $('vHome').style.display = v==='home'?'block':'none';
  $('vScan').style.display = v==='scan'?'block':'none';
  $('vList').style.display = v==='list'?'block':'none';
  $('tabScan').classList.toggle('on', v==='scan');
  $('tabList').classList.toggle('on', v==='list');

    $('appTitle').textContent='LP Scan Form'; paintHomeIdentity(); return; }

/* ---------- camera ---------- */
async function startCam(){
  if(S.camOn) return;
  try{
    await need('qr');
    if(!S.scanner) S.scanner = new Html5Qrcode('reader',{ formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF], verbose:false });
    await S.scanner.start({facingMode:'environment'},
      {fps:12, qrbox:{width:260,height:150}, aspectRatio:1.4}, onScan, ()=>{});
    S.camOn=true; $('camBtn').textContent='ปิดกล้อง';
    $('scanHint').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ';
  }catch(e){
    console.error(e);
    $('scanHint').textContent='เปิดกล้องไม่ได้ — ใช้ปุ่มพิมพ์บาร์โค้ดเองได้เลย';
  }
}
async function stopCam(){ if(S.scanner&&S.camOn){ try{ await S.scanner.stop(); }catch(e){} }
  S.camOn=false; if($('camBtn')) $('camBtn').textContent='เปิดกล้อง'; }
function toggleCam(){ S.camOn?stopCam():startCam(); }
function onScan(txt){
  const now=Date.now();
  if(txt===S.lastScan.code && now-S.lastScan.t<2000) return;
  S.lastScan={code:txt,t:now};
  if(navigator.vibrate) navigator.vibrate(45);
  const raw=normBc(txt);
  openSheet(scaleKey(raw), null, scaleWeightKg(raw));
}
function manualEntry(){
  const v=prompt('พิมพ์บาร์โค้ด'); if(!v) return;
  const raw=normBc(v);
  openSheet(scaleKey(raw), null, scaleWeightKg(raw));
}

/* ---------- item sheet ---------- */
function chip(txt,on,fn,teal){ const b=document.createElement('div');
  b.className='chip'+(on?' on':'')+(teal?' teal':''); b.textContent=txt; b.onclick=fn; return b; }
function buildChips(){
  const curCode=$('fCode').value, knownCode=CODES.some(o=>String(o.c)===String(curCode));
  $('fCodeSel').innerHTML = '<option value="">เลือก Adjust code</option>' +
    CODES.map(o=>'<option value="'+o.c+'"'+(String(curCode)===String(o.c)?' selected':'')+'>'+o.t+'</option>').join('') +
    '<option value="other"'+(curCode&&!knownCode?' selected':'')+'>อื่นๆ (พิมพ์เอง)</option>';
  $('fCode').style.display = ($('fCodeSel').value==='other')?'block':'none';

  const curReason=$('fReason').value, knownReason=REASONS.indexOf(curReason)>=0;
  $('fReasonSel').innerHTML = '<option value="">เลือกเหตุผล</option>' +
    REASONS.map(r=>'<option value="'+r+'"'+(curReason===r?' selected':'')+'>'+r+'</option>').join('') +
    '<option value="other"'+(curReason&&!knownReason?' selected':'')+'>อื่นๆ (พิมพ์เอง)</option>';
  $('fReason').style.display = ($('fReasonSel').value==='other')?'block':'none';

  const pc=$('pctChips'); pc.innerHTML='';
  PCTS.forEach(p=>pc.appendChild(chip(p+'%', Number($('fPct').value)===p, ()=>{
    $('fPct').value=p; buildChips(); calcPrice(); }, true)));
}
function onCodeSelChange(){
  const v=$('fCodeSel').value;
  if(v==='other'){ $('fCode').style.display='block'; $('fCode').value=''; $('fCode').focus(); return; }
  $('fCode').style.display='none';
  $('fCode').value=v;
  const c=Number(v);
  if(!$('fReason').value){
    const r = c===25?'หมดอายุ':c===21?'ชำรุด/เน่าเสีย':c===8?'ขายผิดบาร์โค้ด':
              c===22?'ขาดส่งจาก DC':c===23?'ผลต่างตรวจนับ':'';
    if(r){ $('fReason').value=r; buildChips(); }
  }
  if(!$('fQty').value && [13,21,22,23,25].indexOf(c)>=0) $('fQty').value='-1';
}
function onReasonSelChange(){
  const v=$('fReasonSel').value;
  if(v==='other'){ $('fReason').style.display='block'; $('fReason').value=''; $('fReason').focus(); return; }
  $('fReason').style.display='none';
  $('fReason').value=v;
}
// ปุ่ม ± หน้าช่องจำนวนชิ้น — สลับเครื่องหมายของตัวเลขที่กรอกไว้ ไม่ต้องสลับแป้นพิมพ์เพื่อพิมพ์ "-" เอง
function toggleQtySign(){
  const n=Number($('fQty').value);
  if(!n) return;
  $('fQty').value=-n;
}
function calcPrice(){
  const p=Number($('fPrice').value), pct=Number($('fPct').value);
  $('shCalc').textContent = (p>0&&pct>0) ? roundUpPrice(p,pct/100).toLocaleString()+' ฿' : '—';
}
$('fPrice').addEventListener('input', calcPrice);
$('fPct').addEventListener('input', ()=>{ buildChips(); calcPrice(); });
$('fCodeSel').addEventListener('change', onCodeSelChange);
$('fCode').addEventListener('input', buildChips);
$('fReasonSel').addEventListener('change', onReasonSelChange);
$('fReason').addEventListener('input', buildChips);

function openSheet(bc, editIdx, weightKg){
  S.edit = (editIdx==null)?null:editIdx;
  const isRTC = S.mode==='RTC';
  const it = S.edit!=null ? S.items[S.mode][S.edit] : null;
  const code = bc || (it&&it.bc) || '';
  const m = S.master[code];
  $('shTitle').textContent = S.edit!=null?'แก้ไขรายการ':'เพิ่มรายการ';
  $('shBc').textContent = code;
  // แสดงน้ำหนักที่ถอดจากบาร์โค้ดให้เห็นด้วย (เฉพาะสินค้าชั่งน้ำหนัก) จะได้เช็คกับป้ายจริงได้ทันที
  if(weightKg){ $('shWeight').textContent = 'น้ำหนัก '+weightKg.toFixed(3)+' กก.'; $('shWeight').style.display='block'; }
  else { $('shWeight').style.display='none'; }
  $('shName').textContent = (it&&it.name)||(m&&m.name)||'ไม่พบในรายการสินค้า';
  $('shProd').className = 'prodbox'+(((m&&m.name)||(it&&it.name))?'':' warn');
  $('wrapManualName').style.display = (m&&m.name)?'none':'block';
  $('fName').value = (it&&it.name)||'';
  $('adjFields').style.display = isRTC?'none':'block';
  $('rtcFields').style.display = isRTC?'block':'none';
  if(isRTC){
    $('fUnit').value=(it&&it.unit)||(m&&m.unit)||'ชิ้น';
    // ของใหม่ (ไม่ใช่แก้รายการเดิม) ที่เป็นสินค้าชั่งน้ำหนัก — เอาน้ำหนักจากบาร์โค้ดคูณราคาต่อหน่วยใน
    // master ก่อน ถึงจะได้ราคาจริงของชิ้นนั้น ไม่ใช่ราคาต่อกก./ต่อหน่วยเฉยๆ (แก้รายการเดิมใช้ it.price เดิมไว้)
    const scaledPrice = (!it && weightKg && m && m.price) ? Math.round(weightKg*m.price*100)/100 : null;
    $('fPrice').value=(it&&it.price)||scaledPrice||(m&&m.price)||'';
    $('fPct').value= it?Math.round(it.pct*100):'';
    $('fRQty').value= it?it.qty:1;
    $('fRExp').value=(it&&it.expIso)||'';
  }else{
    $('fCode').value= it?it.code:'';
    $('fQty').value= it?it.qty:'';
    $('fReason').value=(it&&it.reason)||'';
    $('fExp').value=(it&&it.expIso)||'';
  }
  buildChips(); calcPrice();
  S.pending=code;
  // เก็บน้ำหนักไว้ใช้ตอนบันทึก — ถ้าสินค้าชั่งน้ำหนักยังไม่เคยมีใน master ราคาที่กรอกจะเป็นราคารวม
  // ของถุงนี้เท่านั้น (ไม่ใช่ราคาต่อกก.) ต้องหารน้ำหนักออกก่อนเก็บเป็นราคากลาง ไม่งั้นสแกนถุงอื่นน้ำหนัก
  // ต่างกันครั้งต่อไปจะได้ราคาผิด (เอาราคารวมของถุงแรกไปคูณน้ำหนักถุงใหม่)
  S.pendingWeightKg = (S.edit==null) ? (weightKg || null) : null;
  $('sheet').classList.add('show');
}
function closeSheet(){ $('sheet').classList.remove('show'); S.pending=null; S.edit=null; S.pendingWeightKg=null;
  if(S.view==='scan'&&!S.camOn) startCam(); }
function saveItem(){
  if(S.locked){ toast('เอกสารนี้ถูกล็อกแล้ว แก้ไขไม่ได้'); closeSheet(); return; }
  const bc=S.pending, m=S.master[bc];
  const name=(m&&m.name)||$('fName').value.trim();
  if(!name){ toast('กรุณาใส่ชื่อสินค้า'); return; }
  let o;
  if(S.mode==='RTC'){
    const price=Number($('fPrice').value), pct=Number($('fPct').value)/100, qty=Number($('fRQty').value);
    if(!price){ toast('กรุณาใส่ราคาขาย'); return; }
    if(!pct){ toast('กรุณาเลือก % ลดราคา'); return; }
    if(!qty){ toast('กรุณาใส่จำนวน'); return; }
    o={bc,name,unit:$('fUnit').value.trim()||'ชิ้น',price,pct,qty,
       newPrice:roundUpPrice(price,pct),expIso:$('fRExp').value};
  }else{
    const code=Number($('fCode').value), qty=Number($('fQty').value);
    if(!code){ toast('กรุณาเลือก Adjust code'); return; }
    if(!qty){ toast('กรุณาใส่จำนวนชิ้น'); return; }
    o={bc,name,code,qty,reason:$('fReason').value.trim(),expIso:$('fExp').value};
  }
  if(S.edit!=null){
    S.items[S.mode][S.edit]=o;
  }else{
    // สแกนบาร์โค้ดเดิมซ้ำในเอกสารเดียวกัน -> รวมจำนวนไว้ในรายการเดิม ไม่สร้างแถวใหม่
    const dupIdx=S.items[S.mode].findIndex(x=>x.bc===bc);
    if(dupIdx>=0){
      S.items[S.mode][dupIdx].qty=Number(S.items[S.mode][dupIdx].qty)+Number(o.qty);
      toast('บาร์โค้ดซ้ำ — รวมจำนวนกับรายการเดิมแล้ว (รวม '+S.items[S.mode][dupIdx].qty+')');
    }else{
      S.items[S.mode].push(o);
    }
  }
  if(!m){ // ไม่พบบาร์โค้ดในฐานข้อมูล -> เพิ่มเข้าฐานข้อมูลสินค้ากลางทันที (พร้อมราคา/หน่วยถ้ามี เช่นจาก RTC)
    // สินค้าชั่งน้ำหนัก: o.price คือราคารวมของถุงนี้ ต้องหารน้ำหนักออกก่อนเก็บเป็นราคาต่อกก. ใน master
    // ไม่งั้นสแกนถุงเดียวกัน (PLU เดียวกัน) แต่คนละน้ำหนักครั้งต่อไปจะได้ราคาผิด
    const newPrice=S.mode==='RTC'
      ? (S.pendingWeightKg ? Math.round((o.price/S.pendingWeightKg)*100)/100 : o.price)
      : undefined;
    const newUnit=S.mode==='RTC'?o.unit:undefined;
    S.master[bc]=Object.assign({name}, newPrice?{price:newPrice}:{}, newUnit?{unit:newUnit}:{});
    queueProduct(bc,name,newPrice,newUnit);
  }else if(S.mode==='RTC' && S.edit==null){
    // สินค้ามีอยู่ใน master แล้ว แต่ราคาที่กรอกตอนสแกนครั้งนี้ไม่ตรงกับราคาเดิม (ราคาสินค้าเปลี่ยน)
    // -> อัปเดตฐานข้อมูลกลางด้วยราคาล่าสุดทันที ครั้งต่อไปสแกนจะได้ราคาที่ถูกต้อง ไม่ต้องพิมพ์ซ้ำทุกครั้ง
    const unitPrice = S.pendingWeightKg ? Math.round((o.price/S.pendingWeightKg)*100)/100 : o.price;
    const unitChanged = o.unit && o.unit!==m.unit;
    if(Math.abs((m.price||0)-unitPrice)>0.001 || unitChanged){
      S.master[bc]=Object.assign({}, m, {price:unitPrice}, o.unit?{unit:o.unit}:{});
      queueProduct(bc,name,unitPrice,o.unit);
    }
  }
  persist();
  saveDraft();
  closeSheet();
  const n=S.items[S.mode].length;
  $('scanCount').textContent='บันทึกแล้ว '+n+' รายการ';
  toast('บันทึกแล้ว · รวม '+n+' รายการ');
  if(S.view==='list') renderList();
}

/* ---------- list ---------- */
function renderList(){
  const arr=S.items[S.mode]||[], box=$('listBox');
  if(!arr.length){
    box.innerHTML='<div class="card"><div class="empty"><div class="e">☰</div>'+
      '<h3>ยังไม่มีรายการ</h3><p style="font-size:14px;margin:0">กลับไปหน้าสแกนเพื่อเริ่มยิงบาร์โค้ด</p></div></div>';
    $('expBox').style.display='none'; return;
  }
  $('expBox').style.display='block';
  box.innerHTML=arr.map((it,i)=>{
    const tags = S.mode==='RTC'
      ? '<span class="tag t">'+Math.round(it.pct*100)+'%</span>'+
        '<span class="tag">'+it.price+' → <b>'+it.newPrice+'</b> ฿</span>'+
        '<span class="tag">'+it.qty+' '+esc(it.unit)+'</span>'+
        (it.expIso?'<span class="tag">EXP '+thDate(it.expIso)+'</span>':'')
      : '<span class="tag k">Code '+it.code+'</span><span class="tag">'+it.qty+' ชิ้น</span>'+
        (it.reason?'<span class="tag">'+esc(it.reason)+'</span>':'')+
        (it.expIso?'<span class="tag">EXP '+thDate(it.expIso)+'</span>':'');
    const acts = S.locked ? '' :
      '<div class="acts"><button onclick="openSheet(\''+it.bc+'\','+i+')">แก้ไข</button>'+
      '<button class="del" onclick="delItem('+i+')">ลบ</button></div>';
    return '<div class="item"><div class="top"><div class="no">'+(i+1)+'</div>'+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(it.name)+'</div>'+
      '<div class="bc">'+it.bc+'</div></div></div><div class="meta">'+tags+'</div>'+acts+'</div>';
  }).join('');
  renderExport();
}
function delItem(i){ if(S.locked){ toast('เอกสารถูกล็อกแล้ว'); return; }
  if(!confirm('ลบรายการนี้?')) return; S.items[S.mode].splice(i,1); persist(); saveDraft(); renderList(); }
function clearAll(){ if(S.locked){ toast('เอกสารถูกล็อกแล้ว'); return; }
  if(!confirm('ล้างรายการทั้งหมดในโหมดนี้?')) return; S.items[S.mode]=[]; persist(); saveDraft(); renderList(); }
function renderExport(){
  const n=S.items[S.mode].length;
  if(S.locked){
    $('finishTitle').textContent='เอกสารถูกล็อกแล้ว';
    $('expInfo').textContent=n+' รายการ · ส่งให้เดสก์ท็อปพิมพ์ Excel ต่อได้เลย (เลขที่เอกสาร '+S.docId+')';
    $('finishBtn').style.display='none';
  }else{
    $('finishTitle').textContent='จบเอกสาร';
    $('expInfo').textContent=n+' รายการ · เก็บอยู่ในมือถือเท่านั้น — กด "บันทึกและจบเอกสาร" เมื่อสแกนครบแล้ว';
    $('finishBtn').style.display='block';
  }
}

/* ---------- จบเอกสาร ---------- */
window.finishDocument = async function(){
  if(S.locked) return;
  if(!S.items[S.mode].length){ toast('ยังไม่มีรายการให้จบเอกสาร'); return; }
  if(!confirm('ยืนยันบันทึกและจบเอกสาร? ระบบจะส่งข้อมูลขึ้นเดสก์ท็อป และหลังจากนี้จะแก้ไขจากมือถือไม่ได้')) return;
  S.locked=true;
  const finishedId=S.docId;
  enqueueFinished({id:finishedId,doc:docSnapshot('ready')});
  clearDraft(S.employee.code);
  const synced=await trySyncFinishedDocs();
  toast(synced
    ? 'บันทึกเอกสาร '+finishedId+' แล้ว — เปิดจากเดสก์ท็อปได้'
    : 'บันทึกไว้ในมือถือแล้ว — จะส่งขึ้นเดสก์ท็อปอัตโนมัติเมื่อออนไลน์');
  renderList();
  setTimeout(()=>{ S.docId=null; S.locked=false; S.items[S.mode]=[]; go('home'); }, 1500);
};

/* ---------- persistence (สำรองข้อมูลรายการปัจจุบันไว้ในเครื่อง กันแอปถูกปิดกลางคัน) ---------- */
function persist(){
  try{
    localStorage.setItem('lpsf_data', JSON.stringify({
      items:S.items, branch:$('fBranch').value, dept:$('fDept').value, date:$('fDate').value
    }));
  }catch(e){}
}
['fBranch','fDept','fDate'].forEach(id=>$(id).addEventListener('change', ()=>{ persist(); saveDraft(); }));
</script>

<script>
// main ไม่เคยลงทะเบียน service worker เลย — แต่บาง branch พัฒนาที่เคย deploy ทับเว็บนี้ชั่วคราวเคยลงทะเบียนไว้
// (ก่อนแก้ .github/workflows/pages.yml ให้ main เป็นแหล่ง deploy เดียว) อุปกรณ์ที่เคยเปิดเว็บช่วงนั้นอาจยังมี
// service worker ค้างอยู่ ทำให้เห็น asset เก่าค้าง (คนละสาเหตุกับที่ทำให้ HTML เก่าค้าง แต่เป็นความเสี่ยงที่ควรเคลียร์)
// เคลียร์ตัวเองทิ้งแบบเงียบ ๆ ไม่กระทบ UI ผู้ใช้ ไม่เพิ่ม service worker ใหม่
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(()=>{});
}
if(window.caches && caches.keys){
  caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
}
</script>
